<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
  background-color: #f8fafc;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  display: flex;
  width: 100%;
  max-width: 900px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  overflow: hidden;
}

/* ---------------- IMAGE SECTION ---------------- */
.image-section {
  flex: 1;
  background: linear-gradient(135deg, #e6f7f0 0%, #d1e9fa 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px;
}

.image-wrapper {
  text-align: center;
}

.login-image {
  max-width: 100%;
  max-height: 300px;
}

.image-title {
  margin-top: 20px;
  font-size: 24px;
  font-weight: 700;
  color: #0f172a;
  letter-spacing: 0.4px;
}

.image-subtitle {
  margin-top: 8px;
  font-size: 14px;
  color: #475569;
  line-height: 1.6;
}

/* ---------------- FORM SECTION ---------------- */
.form-section {
  flex: 1;
  padding: 50px 40px;
}

.login-title {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 30px;
  text-align: center;
  color: #1a1a1a;
}

.form-group {
  margin-bottom: 22px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
  font-size: 15px;
}

.form-group input {
  width: 100%;
  padding: 13px 16px;
  border: 1px solid #d0d5dd;
  border-radius: 8px;
  font-size: 15px;
}

.form-group input:focus {
  outline: none;
  border-color: #38bdf8;
  box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
}

.login-btn {
  width: 100%;
  padding: 14px;
  background: #0ea5e9;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}

.login-btn:hover {
  background: #0284c7;
}

/* ---------------- FORGOT PASSWORD ---------------- */
.forgot-password {
  text-align: center;
  margin: 18px 0 26px;
}

.forgot-password a {
  color: #0ea5e9;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}

/* ---------------- DIVIDER ---------------- */
.divider {
  display: flex;
  align-items: center;
  margin: 26px 0;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: #e4e7ec;
}

.divider-text {
  padding: 0 14px;
  font-size: 14px;
  color: #667085;
}

/* ---------------- GOOGLE LOGIN ---------------- */
.google-login {
  display: flex;
  justify-content: center;
  margin-bottom: 26px;
}

.google-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  background: white;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: box-shadow 0.2s, transform 0.2s;
}

.google-btn img {
  width: 18px;
  height: 18px;
}

.google-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.12);
}

/* ---------------- SIGNUP ---------------- */
.signup-link {
  text-align: center;
  font-size: 15px;
  color: #667085;
}

.signup-link a {
  color: #0ea5e9;
  font-weight: 600;
  text-decoration: none;
}

/* ---------------- MODAL ---------------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal {
  background: white;
  border-radius: 12px;
  width: 90%;
  max-width: 420px;
  padding: 32px;
}

.modal-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 12px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 20px;
}

.modal-btn {
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.modal-btn.submit {
  background: #0ea5e9;
  color: white;
}

.modal-btn.cancel {
  background: #f3f4f6;
}

/* ---------------- RESPONSIVE ---------------- */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- IMAGE SIDE -->
  <div class="image-section">
    <div class="image-wrapper">
      <img src="assets/login.png" alt="Login Illustration" class="login-image">

      <div class="image-title">Education Management System</div>
      <div class="image-subtitle">
        Smart • Secure • Centralized<br>
        Manage institutions with confidence
      </div>
    </div>
  </div>

  <!-- FORM SIDE -->
  <div class="form-section">
    <h1 class="login-title">Login</h1>

    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
      </div>

      <button class="login-btn">Login</button>
    </form>

    <div class="forgot-password">
      <a href="#" id="forgotPasswordLink">Forgot Password?</a>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or</div>
      <div class="divider-line"></div>
    </div>

    <!-- GOOGLE LOGIN -->
    <div class="google-login">
      <button class="google-btn" id="googleLogin">
        <img src="assets/google.png" alt="Google Logo">
        Continue with Google
      </button>
    </div>

    <div class="signup-link">
      Don’t have an account? <a href="signup.html">Signup</a>
    </div>
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div class="modal-overlay" id="forgotModal">
  <div class="modal">
    <h2 class="modal-title">Reset Password</h2>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="resetEmail" placeholder="Enter email">
    </div>

    <div class="modal-actions">
      <button class="modal-btn cancel" id="cancelReset">Cancel</button>
      <button class="modal-btn submit" id="sendReset">Send Link</button>
    </div>
  </div>
</div>

<script>
const forgotLink = document.getElementById("forgotPasswordLink");
const modal = document.getElementById("forgotModal");
const cancelReset = document.getElementById("cancelReset");

forgotLink.onclick = e => {
  e.preventDefault();
  modal.style.display = "flex";
};

cancelReset.onclick = () => modal.style.display = "none";

document.getElementById("sendReset").onclick = () => {
  alert("Password reset link sent!");
  modal.style.display = "none";
};

document.getElementById("loginForm").onsubmit = e => {
  e.preventDefault();
  alert("Login submitted (connect backend here)");
};

document.getElementById("googleLogin").onclick = () => {
  alert("Google OAuth integration goes here");
};
</script>

</body>
</html>
