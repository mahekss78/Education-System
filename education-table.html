<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Institution Records</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#f4faff] p-6">

  <div class="max-w-7xl mx-auto bg-white rounded-2xl p-6 shadow border">

    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
      <i data-lucide="graduation-cap"></i>
      Institution Records
    </h2>

    <div class="overflow-x-auto text-left">
      <table class="w-full text-sm">
        <thead class="bg-[#eaf4ff] text-gray-700 rounded-lg">
          <tr>
            <th class="p-4 text-left">College</th>
            <th>University</th>
            <th>Location</th>
            <th>Type</th>
            <th>Area Status</th>
            <th>Current Status</th>
            <th>Ranking</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
        

        </tbody>
      </table>
    </div>
  </div>

  <script>lucide.createIcons()</script>

</body>
</html>
