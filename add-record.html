<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Institution Registration Wizard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .step-line { transition: width 0.4s ease-in-out; }
  </style>
</head>

<body class="bg-[#f8fbff] min-h-screen flex flex-col">

<header class="bg-white/80 backdrop-blur-md border-b border-gray-100 p-4 sticky top-0 z-50">
  <h1 class="text-xl font-bold text-center text-gray-800">
    Institution Registration Portal
  </h1>
  <button
    onclick="window.location.href='index.html'"
    class="px-4 py-2 bg-blue-600 text-white rounded-lg">
    Back to Dashboard
  </button>
</header>

<div class="max-w-4xl mx-auto w-full px-6 mt-10">
  <div class="relative flex justify-between items-center">
    <div class="absolute top-5 left-0 w-full h-[2px] bg-gray-200 -z-10"></div>
    <div id="activeLine" class="absolute top-5 left-0 h-[2px] bg-blue-600 -z-10 transition-all duration-500" style="width: 0%"></div>

    <div class="step-item flex flex-col items-center">
      <div id="stepCircle1" class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all duration-300 bg-blue-600 text-white ring-4 ring-white shadow-lg">1</div>
      <span class="text-[10px] mt-2 font-bold uppercase tracking-wider text-blue-600 text-center">Education</span>
    </div>

    <div class="step-item flex flex-col items-center">
      <div id="stepCircle2" class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all duration-300 bg-white border-2 border-gray-200 text-gray-400">2</div>
      <span class="text-[10px] mt-2 font-medium uppercase tracking-wider text-gray-400 text-center">Status</span>
    </div>

    <div class="step-item flex flex-col items-center">
      <div id="stepCircle3" class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all duration-300 bg-white border-2 border-gray-200 text-gray-400">3</div>
      <span class="text-[10px] mt-2 font-medium uppercase tracking-wider text-gray-400 text-center">Profile</span>
    </div>

    <div class="step-item flex flex-col items-center">
      <div id="stepCircle4" class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all duration-300 bg-white border-2 border-gray-200 text-gray-400">4</div>
      <span class="text-[10px] mt-2 font-medium uppercase tracking-wider text-gray-400 text-center">Contact</span>
    </div>

    <div class="step-item flex flex-col items-center">
      <div id="stepCircle5" class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all duration-300 bg-white border-2 border-gray-200 text-gray-400">5</div>
      <span class="text-[10px] mt-2 font-medium uppercase tracking-wider text-gray-400 text-center">Location</span>
    </div>
  </div>
</div>

<main class="flex-1 flex justify-center mt-8 px-4">
  <iframe id="stepFrame"
    src="pages/steps/step1-education.html"
    class="w-full max-w-4xl h-[75vh] bg-transparent rounded-3xl border-none">
  </iframe>
</main>

<footer class="max-w-4xl mx-auto w-full px-6 py-8 flex justify-between items-center">
  <button id="prevBtn"
    class="flex items-center gap-2 px-6 py-2 text-gray-400 font-semibold hover:text-gray-600 transition-colors hidden">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back
  </button>

  <div class="text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em]" id="stepCounter">
    Step 1 of 5
  </div>

  <button id="nextBtn"
    class="flex items-center gap-2 px-8 py-3 bg-blue-600 text-white rounded-xl font-semibold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">
    Next Step
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</footer>

<script>
const steps = [
  { file: "step1-education.html", title: "Education Details" },
  { file: "step2-status.html", title: "Status Flags" },
  { file: "step3-profile.html", title: "Profile Details" },
  { file: "step4-contact.html", title: "Contact Person" },
  { file: "step5-location.html", title: "Location Details" }
];

let currentStep = 0;

const frame = document.getElementById("stepFrame");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const stepCounter = document.getElementById("stepCounter");
const activeLine = document.getElementById("activeLine");

function updateStepper() {
  // Update Circles
  for (let i = 1; i <= steps.length; i++) {
    const circle = document.getElementById(`stepCircle${i}`);
    const label = circle.nextElementSibling;
    
    if (i < currentStep + 1) {
      // Completed Steps
      circle.innerHTML = '✓';
      circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold bg-emerald-500 text-white shadow-lg ring-4 ring-white";
      label.className = "text-[10px] mt-2 font-bold uppercase tracking-wider text-emerald-500 text-center";
    } else if (i === currentStep + 1) {
      // Current Step
      circle.innerHTML = i;
      circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold bg-blue-600 text-white shadow-lg ring-4 ring-white scale-110";
      label.className = "text-[10px] mt-2 font-bold uppercase tracking-wider text-blue-600 text-center";
    } else {
      // Future Steps
      circle.innerHTML = i;
      circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold bg-white border-2 border-gray-200 text-gray-400";
      label.className = "text-[10px] mt-2 font-medium uppercase tracking-wider text-gray-400 text-center";
    }
  }

  // Update Progress Line
  const progress = (currentStep / (steps.length - 1)) * 100;
  activeLine.style.width = `${progress}%`;
}

function updateUI() {
  frame.src = `pages/steps/${steps[currentStep].file}`;
  stepCounter.textContent = `Step ${currentStep + 1} of ${steps.length}`;
  prevBtn.classList.toggle("hidden", currentStep === 0);
  nextBtn.innerHTML = currentStep === steps.length - 1 
    ? 'Finish Registration' 
    : 'Next Step <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  
  updateStepper();
}

nextBtn.addEventListener("click", () => {
  const iframe = frame.contentWindow;
  let isValid = true;
  // 🔒 Step-level validation hook
  if (iframe && typeof iframe.validateStep === "function") {
  try {
      isValid = iframe.validateStep();
    } catch (e) {
      console.error("Validation failed:", e);
      isValid = false;
    }
  }

  if (!isValid) return; // stop navigation


  if (currentStep < steps.length - 1) {
    currentStep++;
    updateUI();
  } else {
    alert("Form Submitted!");
    location.reload();
    localStorage.clear();  
  }
});



prevBtn.addEventListener("click", () => {
  if (currentStep > 0) {
    currentStep--;
    updateUI();
  }
});

updateUI();


</script>

</body>
</html>
