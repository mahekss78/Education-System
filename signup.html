<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
  background-color: #f8fafc;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  display: flex;
  width: 100%;
  max-width: 900px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  overflow: hidden;
}

/* IMAGE SECTION */
.image-section {
  flex: 1;
  background: linear-gradient(135deg, #e6f7f0 0%, #d1e9fa 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px;
}

.image-wrapper {
  text-align: center;
}

.signup-image {
  max-width: 100%;
  max-height: 300px;
}

.image-title {
  margin-top: 20px;
  font-size: 24px;
  font-weight: 700;
  color: #0f172a;
}

.image-subtitle {
  margin-top: 8px;
  font-size: 14px;
  color: #475569;
  line-height: 1.6;
}

/* FORM SECTION */
.form-section {
  flex: 1;
  padding: 50px 40px;
}

.signup-title {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 30px;
  text-align: center;
}

.form-group {
  margin-bottom: 22px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
}

.form-group input {
  width: 100%;
  padding: 13px 16px;
  border: 1px solid #d0d5dd;
  border-radius: 8px;
}

.form-group input:focus {
  outline: none;
  border-color: #38bdf8;
  box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
}

.signup-btn {
  width: 100%;
  padding: 14px;
  background: #0ea5e9;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.signup-btn:hover {
  background: #0284c7;
}

/* DIVIDER */
.divider {
  display: flex;
  align-items: center;
  margin: 26px 0;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: #e4e7ec;
}

.divider-text {
  padding: 0 14px;
  font-size: 14px;
  color: #667085;
}

/* GOOGLE BUTTON */
.google-login {
  display: flex;
  justify-content: center;
  margin-bottom: 26px;
}

.google-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  background: white;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: box-shadow 0.2s, transform 0.2s;
}

.google-btn img {
  width: 18px;
  height: 18px;
}

.google-btn:hover {
  box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  transform: translateY(-1px);
}

/* LOGIN LINK */
.login-link {
  text-align: center;
  font-size: 15px;
  color: #667085;
}

.login-link a {
  color: #0ea5e9;
  font-weight: 600;
  text-decoration: none;
}

/* INFO BOX */
.info-box {
  background-color: #f0f9ff;
  border-left: 4px solid #0ea5e9;
  padding: 18px;
  margin-top: 32px;
  border-radius: 0 8px 8px 0;
  font-size: 14px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- IMAGE SIDE -->
  <div class="image-section">
    <div class="image-wrapper">
      <img src="assets/login.png" class="signup-image">

      <div class="image-title">Create Your Account</div>
      <div class="image-subtitle">
        One platform • Multiple institutions<br>
        Start managing education digitally
      </div>
    </div>
  </div>

  <!-- FORM SIDE -->
  <div class="form-section">
    <h1 class="signup-title">Signup</h1>

    <form id="signupForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password">
      </div>

      <button class="signup-btn">Signup</button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or</div>
      <div class="divider-line"></div>
    </div>

    <!-- GOOGLE SIGNUP -->
    <div class="google-login">
      <button class="google-btn" id="googleSignup">
        <img src="assets/google.png" alt="Google Logo">
        Continue with Google
      </button>
    </div>

    <div class="login-link">
      Already have an account? <a href="login.html">Login</a>
    </div>

    
  </div>
</div>

<script>
document.getElementById("signupForm").onsubmit = e => {
  e.preventDefault();

  if (password.value !== confirmPassword.value) {
    alert("Passwords do not match");
    return;
  }

  alert("Signup submitted (connect backend here)");
};

document.getElementById("googleSignup").onclick = () => {
  alert("Google OAuth signup goes here");
};
</script>

</body>
</html>
