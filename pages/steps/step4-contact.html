<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Step 4 – Contact Person</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2em;
    }
  </style>
</head>

<body class="bg-transparent p-2">

  <div class="max-w-4xl mx-auto bg-white rounded-[2rem] shadow-xl shadow-blue-900/5 p-8 border border-gray-50">
    
    <div class="flex items-center gap-4 mb-10">
      <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-600/20">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
      </div>
      <div>
        <h2 class="text-xl font-bold text-gray-800">Contact Person</h2>
        <p class="text-sm text-gray-500">Provide details for the primary administrative contact</p>
      </div>
    </div>

    <form id="contactForm" class="space-y-8">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-[13px] font-semibold text-gray-700 mb-2 uppercase tracking-wide">Contact Person Name <span class="text-red-500">*</span></label>
          <input type="text" placeholder="John Doe" required
            class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 px-4 outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all">
        </div>
        <div>
          <label class="block text-[13px] font-semibold text-gray-700 mb-2 uppercase tracking-wide">Designation</label>
          <select class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 px-4 outline-none focus:border-blue-500 custom-select transition-all">
            <option>Placement Officer</option>
            <option>HOD</option>
            <option>Dean / Principal</option>
            <option>Admin Staff</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-[13px] font-semibold text-gray-700 mb-4 uppercase tracking-wide">Role Type <span class="text-blue-500 font-normal">(Select One)</span></label>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <label class="relative flex flex-col items-center p-4 border-2 border-blue-600 bg-blue-50/50 rounded-2xl cursor-pointer">
            <input type="radio" name="roleType" value="TPO" checked class="absolute top-4 right-4 w-4 h-4 text-blue-600">
            <span class="text-sm font-bold text-blue-700">TPO</span>
            <span class="text-[10px] text-blue-500 uppercase mt-1">Placement Cell</span>
          </label>
          
          <label class="relative flex flex-col items-center p-4 border-2 border-gray-100 bg-white rounded-2xl cursor-pointer hover:border-gray-300">
            <input type="radio" name="roleType" value="Faculty" class="absolute top-4 right-4 w-4 h-4 text-blue-600">
            <span class="text-sm font-bold text-gray-700">FACULTY</span>
            <span class="text-[10px] text-gray-400 uppercase mt-1">Department Head</span>
          </label>

          <label class="relative flex flex-col items-center p-4 border-2 border-gray-100 bg-white rounded-2xl cursor-pointer hover:border-gray-300">
            <input type="radio" name="roleType" value="Admin" class="absolute top-4 right-4 w-4 h-4 text-blue-600">
            <span class="text-sm font-bold text-gray-700">ADMIN</span>
            <span class="text-[10px] text-gray-400 uppercase mt-1">Institutional Staff</span>
          </label>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-[13px] font-semibold text-gray-700 mb-2 uppercase tracking-wide">Official Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <input type="email" placeholder="official@edu.in"
              class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-11 pr-4 outline-none focus:border-blue-500 transition-all">
          </div>
        </div>
        <div>
          <label class="block text-[13px] font-semibold text-gray-700 mb-2 uppercase tracking-wide">Official Phone</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <input type="tel" placeholder="+91 XXXXX XXXXX"
              class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-11 pr-4 outline-none focus:border-blue-500 transition-all">
          </div>
        </div>
      </div>

      <div>
        <label class="block text-[13px] font-semibold text-gray-700 mb-3 uppercase tracking-wide">Preferred Contact Method</label>
        <div class="inline-flex bg-gray-100 p-1 rounded-xl">
          <button type="button" class="px-6 py-2 rounded-lg bg-white shadow-sm text-sm font-bold text-blue-600">Email</button>
          <button type="button" class="px-6 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-700 transition-all">Phone Call</button>
          <button type="button" class="px-6 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-700 transition-all">WhatsApp</button>
        </div>
      </div>

    </form>
  </div>
<script>
document.querySelectorAll('input[name="roleType"]').forEach(radio => {
  radio.addEventListener('change', () => {
    document.querySelectorAll('input[name="roleType"]').forEach(r => {
      const label = r.closest('label');
      if (r.checked) {
        label.classList.add('border-blue-600', 'bg-blue-50/50');
        label.classList.remove('border-gray-100', 'bg-white');
      } else {
        label.classList.remove('border-blue-600', 'bg-blue-50/50');
        label.classList.add('border-gray-100', 'bg-white');
      }
    });
  });
});
const contactButtons = document.querySelectorAll('.inline-flex button');
contactButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    contactButtons.forEach(b => {
      b.classList.remove('bg-white', 'text-blue-600', 'shadow-sm', 'font-bold');
      b.classList.add('text-gray-500', 'font-medium');
    });
    btn.classList.add('bg-white', 'text-blue-600', 'shadow-sm', 'font-bold');
    btn.classList.remove('text-gray-500', 'font-medium');
  });
});
</script>

</body>
</html>
