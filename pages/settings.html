<!-- SETTINGS : BASIC SYSTEM INFORMATION -->
<div class="bg-white rounded-2xl border shadow-sm p-6 max-w-5xl mx-auto mt-6">

  <h1 class="text-lg font-semibold text-gray-800 mb-1">Settings</h1>
  <h2 class="text-sm text-gray-500 mb-6">
    Configure system-wide preferences and defaults
  </h2>

  <!-- SECTION 1 : SYSTEM INFO -->
  <div class="mb-8">
    <h3 class="text-sm font-semibold text-gray-700 mb-4">
      System Information
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="text-sm font-medium text-gray-600">System Name</label>
        <input type="text" placeholder="EduTech Management System"
          class="mt-1 w-full rounded-lg border px-4 py-2 text-sm
                 focus:ring-2 focus:ring-blue-400 outline-none">
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">System Version</label>
        <input type="text" value="v1.0.0" disabled
          class="mt-1 w-full rounded-lg border px-4 py-2 text-sm bg-gray-100">
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">Default Language</label>
        <select
          class="mt-1 w-full rounded-lg border px-4 py-2 text-sm
                 focus:ring-2 focus:ring-blue-400 outline-none">
          <option>English</option>
          <option>Hindi</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">Time Zone</label>
        <select
          class="mt-1 w-full rounded-lg border px-4 py-2 text-sm
                 focus:ring-2 focus:ring-blue-400 outline-none">
          <option>Asia/Kolkata (IST)</option>
          <option>UTC</option>
        </select>
      </div>
    </div>
  </div>

  <!-- SECTION 2 : INSTITUTION DEFAULTS -->
  <div class="mb-8">
    <h3 class="text-sm font-semibold text-gray-700 mb-4">
      Institution Defaults
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      <div>
        <label class="text-sm font-medium text-gray-600">
          Default Institution Status
        </label>
        <select class="mt-1 w-full rounded-lg border px-4 py-2 text-sm">
          <option>Active</option>
          <option>Pending</option>
          <option>Inactive</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">
          Approval Mode
        </label>
        <select class="mt-1 w-full rounded-lg border px-4 py-2 text-sm">
          <option>Manual Approval</option>
          <option>Auto Approval</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">
          Ranking Scale
        </label>
        <input type="number" placeholder="100"
          class="mt-1 w-full rounded-lg border px-4 py-2 text-sm">
      </div>
    </div>
  </div>

  <!-- SECTION 3 : DATA & PAGINATION -->
  <div class="mb-8">
    <h3 class="text-sm font-semibold text-gray-700 mb-4">
      Data & Display
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      <div>
        <label class="text-sm font-medium text-gray-600">
          Records Per Page
        </label>
        <input type="number" placeholder="10"
          class="mt-1 w-full rounded-lg border px-4 py-2 text-sm">
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">
          Default Sort Order
        </label>
        <select class="mt-1 w-full rounded-lg border px-4 py-2 text-sm">
          <option>Newest First</option>
          <option>Oldest First</option>
          <option>Ranking Wise</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">
          Date Format
        </label>
        <select class="mt-1 w-full rounded-lg border px-4 py-2 text-sm">
          <option>DD/MM/YYYY</option>
          <option>MM/DD/YYYY</option>
        </select>
      </div>
    </div>
  </div>

  <!-- SECTION 4 : SECURITY (BASIC) -->
  <div class="mb-8">
    <h3 class="text-sm font-semibold text-gray-700 mb-4">
      Security
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="text-sm font-medium text-gray-600">
          Session Timeout (minutes)
        </label>
        <input type="number" placeholder="30"
          class="mt-1 w-full rounded-lg border px-4 py-2 text-sm">
      </div>

      <div class="flex items-center gap-3 mt-6">
        <input type="checkbox" class="accent-blue-600">
        <span class="text-sm text-gray-700">
          Enable Two-Factor Authentication
        </span>
      </div>
    </div>
  </div>

  <!-- SAVE BUTTON -->
  <div class="flex justify-end pt-4 border-t">
    <button
      class="px-6 py-2 rounded-lg bg-blue-600 text-white text-sm
             hover:bg-blue-700 transition">
      Save Settings
    </button>
  </div>

</div>
