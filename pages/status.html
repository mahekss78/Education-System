<section class="status-page w-full p-4">

  <h2 class="text-2xl font-semibold mb-6 text-gray-800">Institution Status</h2>

  <!-- Optional Filters -->
  <div class="flex gap-4 mb-4">
    <select id="filter-status" class="border px-3 py-2 rounded" onchange="applyFilters()">
      <option value="">All Status</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
      <option value="pending">Pending</option>
    </select>

    <select id="filter-area" class="border px-3 py-2 rounded" onchange="applyFilters()">
      <option value="">All Areas</option>
      <option value="urban">Urban</option>
      <option value="rural">Rural</option>
    </select>

    <select id="state" class="border px-3 py-2 rounded" onchange="applyFilters()">
      <option value="">All States</option>
      <option value="Andhra Pradesh">Andhra Pradesh</option>
      <option value="Arunachal Pradesh">Arunachal Pradesh</option>
      <option value="Assam">Assam</option>
      <option value="Bihar">Bihar</option>
      <option value="Chhattisgarh">Chhattisgarh</option>
      <option value="Goa">Goa</option>
      <option value="Gujarat">Gujarat</option>
      <option value="Haryana">Haryana</option>
      <option value="Himachal Pradesh">Himachal Pradesh</option>
      <option value="Jharkhand">Jharkhand</option>
      <option value="Karnataka">Karnataka</option>
      <option value="Kerala">Kerala</option>
      <option value="Madhya Pradesh">Madhya Pradesh</option>
      <option value="Maharashtra">Maharashtra</option>
      <option value="Manipur">Manipur</option>
      <option value="Meghalaya">Meghalaya</option>
      <option value="Mizoram">Mizoram</option>
      <option value="Nagaland">Nagaland</option>
      <option value="Odisha">Odisha</option>
      <option value="Punjab">Punjab</option>
      <option value="Rajasthan">Rajasthan</option>
      <option value="Sikkim">Sikkim</option>
      <option value="Tamil Nadu">Tamil Nadu</option>
      <option value="Telangana">Telangana</option>
      <option value="Tripura">Tripura</option>
      <option value="Uttar Pradesh">Uttar Pradesh</option>
      <option value="Uttarakhand">Uttarakhand</option>
      <option value="West Bengal">West Bengal</option>
    </select>

    <select id="type-filter" onchange="applyFilters()">
      <option value="">All College Types</option>
      <option value="B.Tech">B.Tech</option>
      <option value="BCA">BCA</option>
      <option value="BBA">BBA</option>
      <option value="B.Sc">B.Sc</option>
      <option value="Polytechnic">Polytechnic</option>
    </select>

    <input type="text" id="search-institute" placeholder="Search Institute..."
           class="border px-3 py-2 rounded flex-1"
           oninput="searchTable(this.value)" />

    <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
            onclick="clearFilters()">Clear</button>
    <button class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
            onclick="refreshStatusData()">Refresh</button>
  </div>

  <!-- Table container -->
  <div class="overflow-x-auto bg-white rounded-2xl shadow-lg p-4">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Institution</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">State</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Type</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Status</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Area</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Ranking</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Last Inspection</th>
          <th class="px-6 py-3 text-center text-sm font-semibold text-gray-700">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100" id="statusTableBody">
        <!-- Rows injected by status.js -->
      </tbody>
    </table>

    <div id="empty-state" class="hidden text-center text-gray-500 py-6">
      No records found.
    </div>
  </div>

</section>
