<!-- =========================================================
  ADD INSTITUTE – MULTI STEP FORM
  Loaded dynamically inside index.html
========================================================= -->

<section class="add-institute">

  <!-- PAGE TITLE -->
  <h2><i data-lucide="plus-square"></i> Add Institute</h2>

  <!-- ================= STEP INDICATOR ================= -->
  <div class="steps">
    <span class="active"><i data-lucide="building"></i> Institute</span>
    <span><i data-lucide="book-open"></i> Education</span>
    <span><i data-lucide="phone"></i> Contact</span>
    <span><i data-lucide="check-circle"></i> Status</span>
  </div>

  <!-- ================= STEP 1 : INSTITUTE ================= -->
  <div class="step active" id="step-1">
    <h3><i data-lucide="building"></i> Institute Details</h3>

    <input id="college" placeholder="College Name">
    <input id="university" placeholder="University">
    <input id="location" placeholder="Location">

    <div class="actions">
      <button class="btn primary" onclick="nextStep(1)">
        Next <i data-lucide="arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- ================= STEP 2 : EDUCATION ================= -->
  <div class="step" id="step-2">
    <h3><i data-lucide="book-open"></i> Education Details</h3>

    <select id="type">
      <option value="">Select Course Type</option>
      <option>B.Tech</option>
      <option>Polytechnic</option>
      <option>BBA</option>
    </select>

    <input id="ranking" type="number" placeholder="Ranking">

    <div class="actions">
      <button class="btn secondary" onclick="prevStep(2)">
        <i data-lucide="arrow-left"></i> Back
      </button>
      <button class="btn primary" onclick="nextStep(2)">
        Next <i data-lucide="arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- ================= STEP 3 : CONTACT ================= -->
  <div class="step" id="step-3">
    <h3><i data-lucide="phone"></i> Contact Details</h3>

    <input id="email" type="email" placeholder="Email Address">
    <input id="phone" placeholder="Phone Number">

    <div class="actions">
      <button class="btn secondary" onclick="prevStep(3)">
        <i data-lucide="arrow-left"></i> Back
      </button>
      <button class="btn primary" onclick="nextStep(3)">
        Next <i data-lucide="arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- ================= STEP 4 : STATUS ================= -->
  <div class="step" id="step-4">
    <h3><i data-lucide="check-circle"></i> Status Details</h3>

    <select id="status">
      <option>Active</option>
      <option>Inactive</option>
    </select>

    <input id="area" placeholder="Urban / Rural">

    <div class="actions">
      <button class="btn secondary" onclick="prevStep(4)">
        <i data-lucide="arrow-left"></i> Back
      </button>
      <button class="btn success" onclick="submitInstitute()">
        Submit <i data-lucide="check"></i>
      </button>
    </div>
  </div>

</section>

<!-- =========================================================
  STYLES
========================================================= -->
<style>
.add-institute {
  max-width: 700px;
  margin: 0 auto;
  background: #ffffff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  font-family: 'Poppins', sans-serif;
}

/* ---------- Step Indicator ---------- */
.steps {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}

.steps span {
  padding: 6px 14px;
  border-radius: 20px;
  background: #e5e7eb;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.steps span.active {
  background: #2563eb;
  color: white;
}

/* ---------- Steps ---------- */
.step {
  display: none;
  opacity: 0;
  transform: translateX(20px);
  transition: all 0.3s ease;
}

.step.active {
  display: block;
  opacity: 1;
  transform: translateX(0);
}

.step h3 {
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ---------- Inputs ---------- */
.step input,
.step select {
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 14px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-size: 14px;
}

/* ---------- Buttons ---------- */
.actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

.btn {
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn.primary { background: #2563eb; color: white; }
.btn.secondary { background: #e5e7eb; }
.btn.success { background: linear-gradient(135deg, #2563eb, #22c55e); color: white; }
</style>

<!-- =========================================================
  SCRIPT – CORE LOGIC
========================================================= -->
<script>
let currentStep = 1;
window.instituteDraft = {};

/* Show specific step */
function showStep(step) {
  currentStep = step;
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.getElementById(`step-${step}`).classList.add("active");

  document.querySelectorAll(".steps span").forEach((s,i) =>
    s.classList.toggle("active", i+1 === step)
  );
}

/* Navigation */
function nextStep(step) {
  saveStep(step);
  showStep(step+1);
}

function prevStep(step) {
  showStep(step-1);
}

/* Save data step-wise */
function saveStep(step) {
  if(step===1){
    instituteDraft.college = document.getElementById("college").value;
    instituteDraft.university = document.getElementById("university").value;
    instituteDraft.location = document.getElementById("location").value;
  }
  if(step===2){
    instituteDraft.type = document.getElementById("type").value;
    instituteDraft.ranking = document.getElementById("ranking").value;
  }
  if(step===3){
    instituteDraft.email = document.getElementById("email").value;
    instituteDraft.phone = document.getElementById("phone").value;
  }
  if(step===4){
    instituteDraft.activeStatus = document.getElementById("status").value;
    instituteDraft.areaStatus = document.getElementById("area").value;
  }
}

/* Final submit */
function submitInstitute(){
  saveStep(4);
  window.newInstituteRecord = instituteDraft;
  alert("Institute added successfully! Returning to Dashboard...");
  loadPage('pages/dashboard.html', document.querySelector('.menu a.active'));
}

/* Initialize Lucide icons */
lucide.createIcons({ width:18, height:18 });
</script>
